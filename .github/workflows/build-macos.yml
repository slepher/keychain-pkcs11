name: Build macOS PKCS#11 module

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Autotools on the CI runner
        run: brew install autoconf automake libtool

      - name: Build the Intel and Apple Silicon modules
        shell: bash
        run: |
          ./autogen.sh
          source_version=$(./configure --version | awk 'NR == 1 {print $NF}')
          expected_tag="v${source_version}-touchid-prompt.1"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Tag %s does not match expected release tag %s\n' "$GITHUB_REF_NAME" "$expected_tag" >&2
            exit 1
          fi
          build_triplet=$(build-aux/config.guess)

          build_module() {
            local arch=$1 host_arch=$2 min_version=$3
            local flags="-arch $arch -mmacosx-version-min=$min_version -Werror=unguarded-availability -O2"
            mkdir "build-$arch"
            (
              cd "build-$arch"
              ../configure --build="$build_triplet" --host="$host_arch-${build_triplet#*-}" \
                CC=clang OBJC=clang CFLAGS="$flags" OBJCFLAGS="$flags"
              make -j3 keychain-pkcs11.la
            )
          }

          build_module x86_64 x86_64 10.14
          build_module arm64 aarch64 11.0

      - name: Assemble and verify the universal module
        shell: bash
        run: |
          mkdir dist
          module=dist/keychain-pkcs11.dylib
          xcrun lipo -create build-x86_64/.libs/keychain-pkcs11.dylib \
            build-arm64/.libs/keychain-pkcs11.dylib -output "$module"
          xcrun lipo -archs "$module"
          xcrun vtool -show-build "$module"

          deployment_target() {
            xcrun vtool -arch "$1" -show-build "$module" |
              awk '$1 == "minos" {print $2}'
          }
          test "$(deployment_target x86_64)" = 10.14
          test "$(deployment_target arm64)" = 11.0

          codesign --force --sign - "$module"
          codesign --verify --strict --all-architectures "$module"

      - name: Publish the universal module to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          module=dist/keychain-pkcs11.dylib
          if release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets \
            --jq '[.isDraft, any(.assets[]; .name == "keychain-pkcs11.dylib")] | @tsv'); then
            read -r draft has_asset <<< "$release"
            if [[ "$has_asset" == false ]]; then
              gh release upload "$GITHUB_REF_NAME" "$module"
            fi
            if [[ "$draft" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$module" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Universal macOS module with a customizable Touch ID prompt."
          fi
